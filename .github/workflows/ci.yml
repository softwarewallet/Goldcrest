name: Goldcrest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldcrest-ci-test-log
          path: npm-test.log
          if-no-files-found: warn

      - name: Validate Docker production image
        run: docker build --tag goldcrest:ci .
