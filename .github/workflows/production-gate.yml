name: Goldcrest Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
