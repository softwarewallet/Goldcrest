services:
  goldcrest:
    build:
      context: .
      dockerfile: Dockerfile
    image: goldcrest:production
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - goldcrest-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      goldcrest:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      GOLDCREST_DOMAIN: ${GOLDCREST_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  goldcrest-data:
  caddy-data:
  caddy-config:
